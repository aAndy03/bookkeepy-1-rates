# One-time / on-demand history backfill: fetches the BNR YEARLY archives
# (https://curs.bnr.ro/files/xml/years/nbrfxratesYYYY.xml, 2005 → current year) and
# publishes one `kind: "archive"` package per year (spec: docs/package-format.md).
# Run manually via workflow_dispatch. Daily latest quotes are handled by update-rates.yml.
name: backfill-archives

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: ensure signing pubkey is committed
        env:
          RATES_SIGNING_KEY: ${{ secrets.RATES_SIGNING_KEY }}
        run: |
          if [ -z "$RATES_SIGNING_KEY" ]; then echo "::error::RATES_SIGNING_KEY secret missing"; exit 1; fi
          mkdir -p keys
          printf '%s' "$RATES_SIGNING_KEY" > /tmp/k.pem
          openssl pkey -in /tmp/k.pem -pubout -out keys/rates-ed25519.pub.pem
          rm /tmp/k.pem
      - name: build archive packages 2005..current year
        env:
          RATES_SIGNING_KEY: ${{ secrets.RATES_SIGNING_KEY }}
        run: |
          YEAR=$(date -u +%Y)
          for Y in $(seq 2005 "$YEAR"); do
            echo "== $Y"
            python3 tools/build_package.py archive "$Y" "https://curs.bnr.ro/files/xml/years/nbrfxrates{Y}.xml" . || echo "year $Y failed (kept going)"
          done
      - name: commit + push if changed
        run: |
          git config user.name "bookkeepy-rates-bot"
          git config user.email "rates-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "archives already up to date"; else
            git commit -m "rates: BNR archive backfill 2005-$(date -u +%Y) [skip ci]

Generated by Mistral Vibe.
Co-Authored-By: Mistral Vibe <vibe@mistral.ai>"
            git push
          fi
