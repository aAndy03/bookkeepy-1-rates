# Rates mirror automation — the ONE place that talks to live rate sources.
# Owner-approved (round-4 item 18): this repo may spend Actions minutes on a schedule;
# the main app repo does not.
#
# This workflow fetches ONLY the latest quote (https://curs.bnr.ro/nbrfxrates.xml —
# updated in real time after 13:00 each banking day) and publishes a daily package.
# Full history (2005 → current year) lives in archive packages built by backfill.yml.
# Packages are sha256-checksummed and ed25519-signed (key = secret RATES_SIGNING_KEY).
name: update-rates

on:
  schedule:
    - cron: "30 11 * * 1-5" # 13:30 Europe/Bucharest ≈ 11:30 UTC, banking days, after the 13:00 update
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: ensure signing pubkey is committed
        env:
          RATES_SIGNING_KEY: ${{ secrets.RATES_SIGNING_KEY }}
        run: |
          if [ -z "$RATES_SIGNING_KEY" ]; then echo "::error::RATES_SIGNING_KEY secret missing"; exit 1; fi
          mkdir -p keys
          printf '%s' "$RATES_SIGNING_KEY" > /tmp/k.pem
          openssl pkey -in /tmp/k.pem -pubout -out keys/rates-ed25519.pub.pem
          rm /tmp/k.pem
      - name: fetch latest + build daily package
        env:
          RATES_SIGNING_KEY: ${{ secrets.RATES_SIGNING_KEY }}
        run: python3 tools/build_package.py daily https://curs.bnr.ro/nbrfxrates.xml .
      - name: commit + push if changed
        run: |
          git config user.name "bookkeepy-rates-bot"
          git config user.email "rates-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "no new rates today"; else
            git commit -m "rates: bnr daily package $(date -u +%Y-%m-%d) [skip ci]"
            git push
          fi
