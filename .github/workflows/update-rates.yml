# Rates mirror automation — the ONE place that talks to live rate sources.
# Owner-approved (round-4 item 18): this repo may spend Actions minutes on a schedule;
# the main app repo does not. Runs daily + on manual dispatch.
#
# Flow: fetch source feed (BNR first) -> build bookkeepy-rates-package@1 package ->
# sha256 -> ed25519-sign (key = repo secret RATES_SIGNING_KEY, pubkey committed under
# keys/) -> commit + push. Packages are immutable (docs/package-format.md).
name: update-rates

on:
  schedule:
    - cron: "0 6 * * *" # daily 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: derive + commit signing pubkey
        env:
          RATES_SIGNING_KEY: ${{ secrets.RATES_SIGNING_KEY }}
        run: |
          if [ -z "$RATES_SIGNING_KEY" ]; then echo "::error::RATES_SIGNING_KEY secret missing"; exit 1; fi
          printf '%s' "$RATES_SIGNING_KEY" > /tmp/k.pem
          openssl pkey -in /tmp/k.pem -pubout -out keys/rates-ed25519.pub.pem 2>/dev/null || {
            mkdir -p keys && openssl pkey -in /tmp/k.pem -pubout -out keys/rates-ed25519.pub.pem; }
          rm /tmp/k.pem
      - name: fetch + build package (BNR)
        env:
          RATES_SIGNING_KEY: ${{ secrets.RATES_SIGNING_KEY }}
        run: python3 tools/build_package.py bnr https://www.bnr.ro/nbrfxrates.xml .
      - name: commit + push if changed
        run: |
          git config user.name "bookkeepy-rates-bot"
          git config user.email "rates-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "no new rates today"; else
            git commit -m "rates: bnr package $(date -u +%Y-%m-%d) [skip ci]

Generated by Mistral Vibe.
Co-Authored-By: Mistral Vibe <vibe@mistral.ai>"
            git push
          fi
